name: Violet F9 capture correctness

on:
  push:
    branches: [pokemon-za]
    paths:
      - "runtime/nvn/vulkan/device.c"
      - "runtime/nvn/vulkan/exec.c"
      - "runtime/nvn/vulkan/debug_capture_window.h"
      - "tools/violet/graphics_capture_report.ps1"
      - "tests/test_violet_debug_capture_window.c"
      - "tests/test_violet_capture_wiring.py"
      - "tests/test_violet_texture_alias_cache.py"
      - "tests/test_violet_tegra_reference.c"
      - "runtime/nvn/tegra.c"
      - "runtime/nvn/tegra.h"
      - "runtime/nvn/vulkan/textures.c"
      - "runtime/nvn/formats.c"
      - "tests/test_violet_bgra_formats.c"
      - "tests/test_violet_bgra_wiring.py"
      - "Makefile"
      - "runtime/nvn/maxwell/translate.c"
      - "runtime/nvn/maxwell/pixel_imap.h"
      - "tests/test_violet_pixel_imap.c"
      - "tests/test_violet_pixel_imap_translator.c"
      - "tests/test_violet_pixel_imap_wiring.py"
      - ".github/workflows/violet-capture-correctness.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile real C capture-window predicate and run boundary tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/test_violet_debug_capture_window.c -o /tmp/violet-debug-capture-window
          /tmp/violet-debug-capture-window
      - name: Verify render-thread capture wiring and reporting
        run: python3 -m unittest discover -s tests -p test_violet_capture_wiring.py -v
      - name: Verify Nintendo NVN BGR/BGRA byte layouts and color formats
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/test_violet_bgra_formats.c runtime/nvn/formats.c -o /tmp/violet-bgra
          /tmp/violet-bgra
          python3 -m unittest discover -s tests -p test_violet_bgra_wiring.py -v
      - name: Test Tegra block-linear texture addressing against BNTX reference
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/test_violet_tegra_reference.c runtime/nvn/tegra.c -o /tmp/violet-tegra-reference
          /tmp/violet-tegra-reference
      - name: Compile Maxwell fragment shader translator
        run: clang -std=gnu11 -Wall -Wextra -fsyntax-only runtime/nvn/maxwell/translate.c
      - name: Test NVIDIA SPH PixelImap modes
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/test_violet_pixel_imap.c -o /tmp/violet-imap
          /tmp/violet-imap
      - name: Exercise synthesized Maxwell IPA fragment through actual GLSL translator
        run: |
          cc -std=gnu11 -O1 -Wall -Wextra tests/test_violet_pixel_imap_translator.c runtime/nvn/maxwell/translate.c -lm -o /tmp/violet-pixel-imap-translator
          /tmp/violet-pixel-imap-translator
      - name: Check GLSL wiring and cache invalidation
        run: python3 -m unittest discover -s tests -p test_violet_pixel_imap_wiring.py -v
      - name: Verify texture views never reuse stale copy aliases
        run: python3 -m unittest discover -s tests -p test_violet_texture_alias_cache.py -v
