name: Violet launcher checks

on:
  push:
    branches: [pokemon-za]
    paths:
      - "Play Violet.cmd"
      - "tools/violet/startup_menu.ps1"
      - "tools/violet/graphics_triage.ps1"
      - "tools/violet/graphics_capture_report.ps1"
      - "tools/violet/graphics_capture_launch.ps1"
      - "tools/violet/graphics_probe_launch.ps1"
      - "tools/violet/graphics_hair_probe_launch.ps1"
      - "runtime/nvn/objects.c"
      - "runtime/ui/launcher.mm"
      - "tools/violet/run.ps1"
      - "tests/test_violet_layout_fallback.py"
      - "tools/violet/graphics_local_report.py"
      - "tests/test_violet_graphics_local_report.py"
      - "tools/violet/build.ps1"
      - "tools/violet/make_local.sh"
      - "tools/violet/symbolize_crash.ps1"
      - "tools/violet/VioletNativeSymbols.cs"
      - "tools/violet/addr2line_crash.py"
      - "tests/test_violet_addr2line_crash.py"
      - "tests/test_violet_make_args.sh"
      - "tools/violet/boot_triage.py"
      - "tests/test_violet_boot_triage.py"
      - ".github/workflows/violet-launcher-check.yml"
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse runner with PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/run.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/build.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
      - name: Check graphics A/B modes without launching game
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/graphics_triage.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $baseline = ./tools/violet/graphics_triage.ps1 -Mode Baseline -DryRun | Out-String
          $zero = ./tools/violet/graphics_triage.ps1 -Mode PackagedZero -DryRun | Out-String
          $safe = ./tools/violet/graphics_triage.ps1 -Mode ConservativeUploads -DryRun 3>&1 | Out-String
          $shadows = ./tools/violet/graphics_triage.ps1 -Mode ShadowCompareOff -DryRun 3>&1 | Out-String
          $deriv = ./tools/violet/graphics_triage.ps1 -Mode ShaderQuadDerivatives -DryRun | Out-String
          $quad = ./tools/violet/graphics_triage.ps1 -Mode ShaderQuadControl -DryRun | Out-String
          $depth = ./tools/violet/graphics_triage.ps1 -Mode DepthEqualTolerance -DryRun | Out-String
          $off = ./tools/violet/graphics_triage.ps1 -Mode NoDepthTest -DryRun 3>&1 | Out-String
          if ($baseline -notmatch 'Overrides: none' -or
              $zero -notmatch 'LARECOMP_PACKAGED_ZERO_BH=1' -or
              $safe -notmatch 'LARECOMP_TEX_UNPACK_THREADS=0' -or
              $shadows -notmatch 'LARECOMP_NO_SHADOW=1' -or
              $deriv -notmatch 'LARECOMP_SHADER_QUAD_DERIV=1' -or
              $deriv -notmatch 'LARECOMP_SHADER_QUAD_CONTROL=0' -or
              $quad -notmatch 'LARECOMP_SHADER_QUAD_CONTROL=1' -or
              $depth -notmatch 'LARECOMP_VK_EQUAL_TOL=1' -or
              $off -notmatch 'LARECOMP_NO_DEPTH_TEST=1') {
            throw 'A/B test toggles did not select the expected graphics paths.'
          }
          $v = @('LARECOMP_PACKAGED_ZERO_BH', 'LARECOMP_TEX_UNPACK_THREADS', 'LARECOMP_NO_SHADOW',
                 'LARECOMP_SHADER_QUAD_DERIV', 'LARECOMP_SHADER_QUAD_CONTROL',
                 'LARECOMP_VK_EQUAL_TOL', 'LARECOMP_NO_DEPTH_TEST')
          foreach ($name in $v) {
            if ([Environment]::GetEnvironmentVariable($name, 'Process')) {
              throw "A/B test contaminated the runner environment with $name."
            }
          }
      - name: Check frame-accurate F9 capture launcher in dry-run mode
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/graphics_capture_launch.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $capture = ./tools/violet/graphics_capture_launch.ps1 -Frames 3 -DryRun | Out-String
          if ($capture -notmatch '3 consecutive rendering frames') { throw 'F9 capture launcher did not select three frames.' }
          if ($env:LARECOMP_DEBUG_FRAMES) { throw 'F9 capture launcher leaked an environment variable.' }
      - name: Validate per-draw striped-pixel probe and environment cleanup
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/graphics_probe_launch.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $out = ./tools/violet/graphics_probe_launch.ps1 -X 400 -Y 780 -Frames 2 -DryRun | Out-String
          if ($out -notmatch '400,780' -or $out -notmatch '2 frames') {
            throw "Probe launcher did not select configured scene pixel: $out"
          }
          # Windows PowerShell 5.1 reads an unmarked .ps1 as ANSI (not UTF-8).
          # Test the exact interpreter/invocation used by Play Violet users.
          $legacy = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File './tools/violet/graphics_probe_launch.ps1' -X 400 -Y 780 -Frames 2 -DryRun
          if ($LASTEXITCODE -ne 0 -or ($legacy -join ' ') -notmatch '400,780') {
            throw "PowerShell 5.1 failed to parse the probe launcher: $($legacy -join ' ')"
          }
          if ($env:LARECOMP_PROBE -or $env:LARECOMP_DEBUG_FRAMES) {
            throw 'Probe launcher leaked temporary environment variables.'
          }
          $hairErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/graphics_hair_probe_launch.ps1'), [ref]$null, [ref]$hairErrors) | Out-Null
          if ($hairErrors.Count) { throw ($hairErrors | Out-String) }
          $hair = ./tools/violet/graphics_hair_probe_launch.ps1 -DryRun | Out-String
          if ($hair -notmatch '470,430' -or $hair -notmatch 'hair-material probe') {
            throw "Hair probe did not select its local pixel region: $hair"
          }
          if (Test-Path 'build/violet-graphics-diagnostics/probe-coordinates.json') {
            throw 'Hair probe dry-run created a real capture config.'
          }
          $legacyHair = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File './tools/violet/graphics_hair_probe_launch.ps1' -DryRun
          if ($LASTEXITCODE -ne 0 -or ($legacyHair -join ' ') -notmatch '470,430') {
            throw 'PowerShell 5.1 failed to run the hair pixel probe.'
          }
      - name: Test F9 render-pass contact-sheet archive with synthetic images
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/graphics_capture_report.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Add-Type -AssemblyName System.Drawing
          $b = [System.Drawing.Bitmap]::new(16, 16)
          try {
            $b.Save((Join-Path $PWD 'build/pass_000.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $b.Save((Join-Path $PWD 'build/pass_001.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          } finally { $b.Dispose() }
          $report = ./tools/violet/graphics_capture_report.ps1 -MaxImages 2 -Minutes 2 | Out-String
          if ($report -notmatch 'Indexed 2 pass images') { throw "Unexpected capture report: $report" }
          $zip = Get-ChildItem -Path build -Filter 'violet-graphics-report-*.zip' | Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) { throw 'F9 capture ZIP was not created.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = @($entries.Entries | ForEach-Object { $_.Name })
            if ($names -notcontains 'contact-sheet-01.png' -or $names -notcontains 'pass-index.txt') {
              throw "Capture ZIP missing index or image: $($names -join ', ')"
            }
          } finally { $entries.Dispose() }
      - name: Validate Windows startup menu and keybinding choices
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/startup_menu.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $choices = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/violet/startup_menu.ps1 -ListChoices
          if (($choices -join ',') -ne 'play=0,controls=2,quit=3') {
            throw "Startup chooser returned unexpected options: $($choices -join ',')"
          }
          $batch = Get-Content -LiteralPath './Play Violet.cmd' -Raw
          $native = Get-Content -LiteralPath './runtime/ui/launcher.mm' -Raw
          if ($batch -notmatch 'MENU_CHOICE' -or $batch -notmatch '\-OpenControls' -or
              $batch -notmatch '\-Play' -or $native -notmatch 'VIOLET_LAUNCHER_OPEN_CONTROLS') {
            throw 'Startup chooser is not connected to both native launch paths.'
          }
      - name: Test launcher preflight with synthetic placeholder files
        shell: pwsh
        run: |
          $paths = @(
            'build/violet-gnu/lasrecomp.exe',
            'build/violet-gnu/lasgame.dll',
            'extracted/exefs/main',
            'extracted/exefs/subsdk0',
            'extracted/exefs/sdk',
            'extracted/exefs/main.npdm',
            'extracted/romfs.bin'
          )
          foreach ($p in $paths) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
            New-Item -ItemType File -Force -Path $p | Out-Null
          }
          New-Item -ItemType Directory -Force -Path 'build/msys-deps/ucrt64/bin' | Out-Null
          ./tools/violet/run.ps1 -CheckOnly
          ./tools/violet/run.ps1 -OpenControls -CheckOnly
          $conflictFailed = $false
          try { ./tools/violet/run.ps1 -Play -OpenControls -CheckOnly } catch { $conflictFailed = $true }
          if (-not $conflictFailed) { throw 'Launcher allowed contradictory Play and OpenControls switches.' }
          Remove-Item 'extracted/romfs.bin'
          $failed = $false
          try { ./tools/violet/run.ps1 -CheckOnly } catch { $failed = $true }
          if (-not $failed) { throw 'CheckOnly failed to detect a missing RomFS.' }
      - name: Test MSYS2 make argument quoting
        shell: bash
        run: |
          bash -n tools/violet/make_local.sh
          bash tests/test_violet_make_args.sh
      - name: Compile native PDB resolver and scan sample host crash
        shell: pwsh
        run: |
          Add-Type -Path ./tools/violet/VioletNativeSymbols.cs -ErrorAction Stop
          # Exercise the Windows DbgHelp P/Invoke code on an ordinary system PE image.
          # Its lack of our game's PDB is expected; resolving an unknown symbol is fine.
          $probe = [VioletNativeSymbols]::Resolve(
            (Join-Path $env:WINDIR 'System32/kernel32.dll'), [UInt64[]]@(0x1000))
          if ($probe.Count -ne 1 -or $probe[0] -notmatch '0x1000') {
            throw 'DbgHelp resolver could not load a Windows PE image.'
          }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/violet/symbolize_crash.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          $testLog = Join-Path $env:RUNNER_TEMP 'violet-host-crash.log'
          @'
          *** exception c0000005 accessing 0
          host backtrace (guest functions are f_<addr>):
            #10 00007ff6ac7aefd8 lasrecomp+7efd8
            #11 00007ff6ac7f2f36 lasrecomp+c2f36
            #12 00007ff6ac7aae66 lasrecomp+7ae66
          '@ | Set-Content -LiteralPath $testLog -Encoding UTF8
          $output = ./tools/violet/symbolize_crash.ps1 -LogPath $testLog -ScanOnly | Out-String
          if ($output -notmatch '0x7efd8' -or $output -notmatch '0xc2f36') {
            throw "Missing native fault offsets: $output"
          }
      - name: Check Violet missing-attribute fallback is safe and reversible
        shell: pwsh
        run: python -m unittest discover -s tests -p test_violet_layout_fallback.py -v
      - name: Verify no-ZIP graphics summary works without private game files
        shell: pwsh
        run: python -m unittest discover -s tests -p test_violet_graphics_local_report.py -v
      - name: Test PE and MinGW DWARF crash symbolizer
        shell: pwsh
        run: python -m unittest discover -s tests -p test_violet_addr2line_crash.py -v
      - name: Test boot log analyzer
        shell: pwsh
        run: python -m unittest discover -s tests -p test_violet_boot_triage.py -v
